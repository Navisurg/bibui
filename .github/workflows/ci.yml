name: ci

# Builds every project in Release with warnings as errors, runs the unit tests,
# checks that each sample renders its first frame, and publishes a test app
# with Native AOT. release.yml calls this workflow before it packs, so a tag is
# released only from a commit that passes it.
#
# Pixel verification (the fixture suite and its reference pictures) is kept by
# the maintainers outside this repository; see CONTRIBUTING.md.

"on":
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      # Deterministic builds with the runner's paths mapped to /_/
      # (Directory.Build.props), as release.yml packs them.
      ContinuousIntegrationBuild: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # FreeType and HarfBuzz: the managed raster backend's text engine.
      # clang and zlib: Native AOT links with them.
      - name: Install system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6 libharfbuzz0b clang zlib1g-dev

      # Every project in the repository. Each sets TreatWarningsAsErrors; it is
      # passed here too, so a project that forgets it still fails on a warning.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          for proj in \
            bibui-text/bibui-text.csproj \
            bibui-core/bibui-core.csproj \
            bibui-gl/bibui-gl.csproj \
            bibui-testing/bibui-testing.csproj \
            bibui-raster-skia/bibui-raster-skia.csproj \
            bibui-raster-managed/src/Bibui.Raster.Managed.csproj \
            bibui-raster-managed/backend/Bibui.Raster.Managed.Backend.csproj \
            bibui-platform-silk/bibui-platform-silk.csproj \
            bibui-platform-wayland/bibui-platform-wayland.csproj \
            bibui-platform-browser/bibui-platform-browser.csproj \
            bibui-apps/silk-skia-gl/bibui-app-silk-skia-gl.csproj \
            bibui-apps/silk-skia-cpu/bibui-app-silk-skia-cpu.csproj \
            bibui-apps/silk-managed/bibui-app-silk-managed.csproj \
            bibui-apps/wayland-managed/bibui-app-wayland-managed.csproj \
            bibui-apps/wayland-skia-cpu/bibui-app-wayland-skia-cpu.csproj \
            bibui-all/bibui-all.csproj \
            tools/wayland-scanner/wayland-scanner.csproj \
            bibui-raster-managed/tests/Bibui.Raster.Managed.Tests.csproj \
            bibui-raster-managed/damage-tests/Bibui.Raster.Managed.DamageTests.csproj \
            tests/bibui-runtime-tests/bibui-runtime-tests.csproj \
            tests/text-tests/text-tests.csproj \
            tests/png-tests/png-tests.csproj \
            tests/wayland-tests/wayland-tests.csproj \
            tests/wayland-hello/wayland-hello.csproj \
            tests/app-packages-tests/app-packages-tests.csproj \
            tests/browser-tests/browser-tests.csproj \
            samples/component-gallery/component-gallery.csproj \
            samples/bibui-app/bibui-app.csproj \
            samples/counter-gl/counter-gl.csproj \
            samples/counter-cpu/counter-cpu.csproj \
            samples/counter-wayland/counter-wayland.csproj
          do
            echo "==> build $proj"
            dotnet build "$proj" --configuration Release -p:TreatWarningsAsErrors=true
          done

      # The test programs CONTRIBUTING.md lists. Each prints what failed and
      # exits non-zero. tests/wayland-tests is headless and reports SKIP for
      # what needs a compositor or the protocol XML.
      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          for proj in \
            tests/bibui-runtime-tests/bibui-runtime-tests.csproj \
            tests/text-tests/text-tests.csproj \
            tests/png-tests/png-tests.csproj \
            tests/wayland-tests/wayland-tests.csproj \
            bibui-raster-managed/tests/Bibui.Raster.Managed.Tests.csproj \
            bibui-raster-managed/damage-tests/Bibui.Raster.Managed.DamageTests.csproj \
            tests/app-packages-tests/app-packages-tests.csproj \
            tests/browser-tests/browser-tests.csproj
          do
            echo "==> test $proj"
            dotnet run --project "$proj" --configuration Release --no-build
          done

      # Every sample renders its first frame, headless (--first-frame: mount,
      # one Render, exit). A build function that throws, or a layout ring,
      # fails here rather than in a window.
      - name: Start-up check (first frame of each sample)
        shell: bash
        run: |
          set -euo pipefail
          first_frame() {
            echo "==> first frame: $*"
            dotnet run --project "$1" --configuration Release --no-build -- --first-frame "${@:2}"
          }
          first_frame samples/bibui-app/bibui-app.csproj
          first_frame samples/component-gallery/component-gallery.csproj
          # The gallery on another Bibui.App package, chosen at build time.
          dotnet run --project samples/component-gallery/component-gallery.csproj --configuration Release \
            -p:App=WaylandManaged -- --first-frame
          first_frame tests/wayland-hello/wayland-hello.csproj

      # An app on the raw Wayland host and the managed rasterizer publishes with
      # Native AOT. Trim and AOT analysis (IL2xxx, IL3xxx) runs only on a
      # publish, so the build above cannot catch a regression; this does, with
      # every warning an error. Then the binary renders its first frame.
      - name: Native AOT publish of wayland-hello
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish tests/wayland-hello/wayland-hello.csproj \
            --configuration Release -r linux-x64 \
            -p:PublishAot=true -p:TreatWarningsAsErrors=true \
            --output aot/wayland-hello
          ls -l aot/wayland-hello/wayland-hello
          aot/wayland-hello/wayland-hello --first-frame

      # The same for an app on a Bibui.App package: what docs/app-packages.md
      # promises of Bibui.App.WaylandManaged. It opens a window to run, so CI
      # only publishes it.
      - name: Native AOT publish of counter-wayland (Bibui.App.WaylandManaged)
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish samples/counter-wayland/counter-wayland.csproj \
            --configuration Release -r linux-x64 \
            -p:PublishAot=true -p:TreatWarningsAsErrors=true \
            --output aot/counter-wayland
          ls -l aot/counter-wayland/counter-wayland

  # The browser route: the wasm-tools workload, FreeType and HarfBuzz built
  # for the browser from their pinned releases, the package and the sample
  # built with warnings as errors, and the sample driven in headless Chrome.
  # The library itself and tests/browser-tests build and run in build-test,
  # which needs no workload.
  browser:
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      ContinuousIntegrationBuild: "true"
      # The SDK in a directory the job owns, so the workload installs without sudo.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/../dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Emscripten and the native relink the browser app's link needs.
      - name: Install the wasm-tools workload
        shell: bash
        run: dotnet workload install wasm-tools

      # The archives depend only on the pinned releases and the build files
      # (versions.env holds the releases, their hashes and the Emscripten).
      - name: Cache FreeType and HarfBuzz for the browser
        id: native
        uses: actions/cache@v4
        with:
          path: bibui-platform-browser/native/lib
          key: browser-native-${{ hashFiles('bibui-platform-browser/native/*') }}

      - name: Build FreeType and HarfBuzz for the browser
        if: steps.native.outputs.cache-hit != 'true'
        shell: bash
        run: bibui-platform-browser/native/build.sh

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          for proj in \
            bibui-platform-browser/bibui-platform-browser.csproj \
            samples/counter-browser/counter-browser.csproj
          do
            echo "==> build $proj"
            dotnet build "$proj" --configuration Release -p:TreatWarningsAsErrors=true
          done

      # The package carries the JavaScript module, the archives, their
      # licences and the targets that link them.
      - name: Pack Bibui.Platform.Browser
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack bibui-platform-browser/bibui-platform-browser.csproj --configuration Release \
            --output nupkgs -p:TreatWarningsAsErrors=true
          listing=$(unzip -l nupkgs/Bibui.Platform.Browser.*.nupkg)
          echo "$listing"
          for file in staticwebassets/bibui-browser.js buildTransitive/Bibui.Platform.Browser.targets \
            buildTransitive/native/libfreetype.so.6.a buildTransitive/native/libharfbuzz.so.0.a \
            licenses/FreeType-FTL.txt licenses/HarfBuzz-COPYING.txt
          do
            grep -qF "$file" <<< "$listing" || { echo "::error::the package has no $file"; exit 1; }
          done

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The counter in headless Chrome at devicePixelRatio 1, 1.25 and 2:
      # it draws text, the button answers the pointer, clicks count.
      - name: Browser smoke test
        shell: bash
        env:
          SMOKE_SCREENSHOTS: smoke
        run: |
          set -euo pipefail
          dotnet publish samples/counter-browser/counter-browser.csproj --configuration Release \
            -p:TreatWarningsAsErrors=true --output out/counter-browser
          node tests/browser-smoke/smoke.mjs out/counter-browser/wwwroot

      - name: Upload the smoke test's screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke
          path: smoke/
          if-no-files-found: ignore
          retention-days: 7
